<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo Squircle oscuro minimalista -->
  <rect width="32" height="32" rx="7" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
  
  <!-- Lápiz minimalista estilizado en ángulo -->
  <g transform="translate(16, 16) rotate(-45)">
    <!-- Borrador superior -->
    <rect x="-2" y="-10" width="4" height="2" rx="0.8" fill="#3f3f46" />
    
    <!-- Anillo metálico -->
    <rect x="-2" y="-8" width="4" height="1.5" fill="#a1a1aa" />
    
    <!-- Cuerpo del lápiz -->
    <!-- Faceta izquierda oscura -->
    <rect x="-2" y="-6.5" width="1.3" height="11" fill="#71717a" />
    <!-- Faceta central blanca brillante -->
    <rect x="-0.7" y="-6.5" width="1.4" height="11" fill="#ffffff" />
    <!-- Faceta derecha gris media -->
    <rect x="0.7" y="-6.5" width="1.3" height="11" fill="#a1a1aa" />
    
    <!-- Cono de la punta -->
    <polygon points="-2,4.5 2,4.5 0,9" fill="#e4e4e7" />
    <!-- Punta de grafito -->
    <polygon points="-1,7.2 1,7.2 0,9.2" fill="#18181b" />
  </g>
</svg>
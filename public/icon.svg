<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Squircle rounded background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Subtle inner circuit / focus lines -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Central Icon Mark: Sparkle / Diamond Focus & Check -->
  <g filter="url(#glow)">
    <path d="M 256 120 L 290 220 L 390 256 L 290 292 L 256 392 L 222 292 L 122 256 L 222 220 Z" fill="url(#glowGrad)" />
  </g>
  
  <!-- Floating Checkmark Symbol -->
  <path d="M 210 256 L 244 290 L 316 218" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
</svg>

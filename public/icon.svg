<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo oscuro sutil y elegante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Reflejos metálicos neutros para la virola -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <!-- Sombra sutil del lápiz -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base (App Icon) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />

  <!-- Línea de trazo minimalista fino -->
  <path d="M 120 376 C 145 376, 155 365, 175 345" fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round" />

  <!-- Contenedor del lápiz inclinado a 45 grados -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#softShadow)">
    
    <!-- === BORRADOR / TAPA SUPERIOR (Minimalista) === -->
    <path d="M -20 -95 L 20 -95 C 20 -115, -20 -115, -20 -95 Z" fill="#27272a" stroke="#3f3f46" stroke-width="1.5" />

    <!-- === VIROLA METÁLICA (Anillo plateado) === -->
    <rect x="-21" y="-95" width="42" height="18" rx="2" fill="url(#metalGrad)" />
    <!-- Línea decorativa del anillo metálico -->
    <line x1="-21" y1="-86" x2="21" y2="-86" stroke="#3f3f46" stroke-width="1" />

    <!-- === CUERPO DEL LÁPIZ (Facetas tridimensionales minimalistas) === -->
    <!-- Faceta izquierda (Sombra sutil) -->
    <polygon points="-21,-77 -7,-77 -7,80 -21,80" fill="#71717a" />
    <!-- Faceta central (Luz directa / Blanco brillante) -->
    <polygon points="-7,-77 7,-77 7,80 -7,80" fill="#f4f4f5" />
    <!-- Faceta derecha (Tono medio plata/gris) -->
    <polygon points="7,-77 21,-77 21,80 7,80" fill="#a1a1aa" />

    <!-- === CONO DE LA PUNTA (Madera / Bisel) === -->
    <!-- Sección izquierda del cono -->
    <polygon points="-21,80 -7,80 0,120" fill="#a1a1aa" />
    <!-- Sección central del cono -->
    <polygon points="-7,80 7,80 0,120" fill="#e4e4e7" />
    <!-- Sección derecha del cono -->
    <polygon points="7,80 21,80 0,120" fill="#71717a" />

    <!-- === GRAFITO DE LA PUNTA === -->
    <polygon points="-5.5,109 5.5,109 0,124" fill="#18181b" stroke="#09090b" stroke-width="0.5" />
  </g>
</svg>
